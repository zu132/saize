<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>紹介 | 間違い探し粛清ソリューション</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />

    <style>
      :root {
        --saize-green: #1b5e20;
        --saize-red: #c62828;
        --saize-gold: #ffc107;
      }
      body {
        font-family: "Noto Sans JP", sans-serif;
        background: linear-gradient(135deg, #f5f5f0 0%, #e8e8e0 100%);
      }
      .vote-btn {
        position: absolute;
        top: 50%;
        right: 2rem;
        transform: translateY(-50%);
        background: var(--saize-gold);
        color: var(--saize-green);
        padding: 0.6rem 1.2rem;
        text-decoration: none;
        border-radius: 50px;
        font-weight: bold;
      }
      .section-card {
        max-width: 900px;
        margin: 2rem auto;
        padding: 2.5rem;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        opacity: 0;
        transform: translateY(30px);
        transition: all 0.8s ease-out;
      }
      .section-card.visible {
        opacity: 1;
        transform: translateY(0);
      }
      .tech-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1.5rem;
      }
      .progress-bar-bg {
        background: #ddd;
        height: 20px;
        border-radius: 10px;
        overflow: hidden;
        margin-top: 10px;
      }
      .progress-fill {
        background: var(--saize-green);
        width: 0%;
        height: 100%;
        transition: width 2s ease-in-out;
      }
      .start-btn {
        padding: 1.2rem 4rem;
        background: var(--saize-red);
        color: white;
        text-decoration: none;
        border-radius: 50px;
        font-size: 1.5rem;
        font-weight: bold;
        display: inline-block;
        margin: 3rem 0;
      }
      @media (max-width: 600px) {
        .vote-btn {
          position: static;
          display: inline-block;
        }
      }
    </style>
  </head>
  <body>
    <header style="position: relative">
      <h1 class="animate__animated animate__fadeInDown">
        間違い探し粛清ソリューション
      </h1>
      <p>Engineering for Saizeriya Mistake Finder</p>
      <a
        href="https://docs.google.com/forms/d/e/1FAIpQLSeY43W6nd3n1H7E1WFdpJ7HP0WcjCDGs1RYu8DmgaTEGE39hw/viewform?pli=1"
        class="vote-btn"
      >
        <i class="fas fa-vote-yea"></i> 投票
      </a>
    </header>

    <main class="container" style="text-align: center">
      <section class="section-card">
        <h2><i class="fas fa-lightbulb"></i> 開発の動機</h2>
        <p>
          サイゼリヤの超難解な間違い探しを攻略し、料理を最高の状態で楽しむためのプロダクト。AWS採用を「ゆがみ補正の精度」のためにあえて断念し、独自のローカル解析エンジンを構築しました。
        </p>
      </section>

      <section class="section-card">
        <h2><i class="fas fa-tasks"></i> 進捗状況：90%</h2>
        <div class="progress-bar-bg">
          <div class="progress-fill" data-percent="90"></div>
        </div>
      </section>

      <a
        href="/main"
        class="start-btn animate__animated animate__pulse animate__infinite"
        >システム起動</a
      >
    </main>

    <script>
      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add("visible");
              const p = entry.target.querySelector(".progress-fill");
              if (p) p.style.width = p.getAttribute("data-percent") + "%";
            }
          });
        },
        { threshold: 0.1 }
      );
      document
        .querySelectorAll(".section-card")
        .forEach((c) => observer.observe(c));
    </script>
  </body>
</html>
