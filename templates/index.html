<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>判定 | 間違い探し粛清ソリューション</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.css"
      rel="stylesheet"
    />
    <style>
      .vote-btn {
        position: absolute;
        top: 50%;
        right: 2rem;
        transform: translateY(-50%);
        background-color: #ffc107;
        color: #1b5e20;
        padding: 0.5rem 1rem;
        text-decoration: none;
        border-radius: 5px;
        font-weight: bold;
      }
      .toggle-box {
        margin: 15px 0;
        background: #eef7ff;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #4a90e2;
        text-align: center;
      }
      .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100vh;
        background-color: rgba(0, 0, 0, 0.6);
      }
      .modal-content {
        background-color: white;
        margin: 2vh auto;
        padding: 20px;
        width: 90%;
        max-width: 1200px;
        text-align: center;
      }
      #cropping-image {
        max-width: 100%;
        max-height: 65vh;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <header style="position: relative">
      <h1>間違い探し粛清ソリューション</h1>
      <p>画像をセットして比較実行してください。</p>
      <a
        href="https://docs.google.com/forms/d/e/1FAIpQLSeY43W6nd3n1H7E1WFdpJ7HP0WcjCDGs1RYu8DmgaTEGE39hw/viewform?pli=1"
        class="vote-btn"
        >投票</a
      >
    </header>

    <main class="container">
      <form id="compareForm">
        <div class="image-upload-wrapper">
          <div class="image-input-container">
            <h3>画像1</h3>
            <img
              id="preview1"
              class="image-preview"
              src="https://via.placeholder.com/300x200.png?text=画像1"
            />
            <button
              type="button"
              class="btn-select"
              data-target="1"
              data-action="upload"
            >
              選択
            </button>
            <input type="hidden" id="image1_b64" />
          </div>
          <div class="image-input-container">
            <h3>画像2</h3>
            <img
              id="preview2"
              class="image-preview"
              src="https://via.placeholder.com/300x200.png?text=画像2"
            />
            <button
              type="button"
              class="btn-select"
              data-target="2"
              data-action="upload"
            >
              選択
            </button>
            <input type="hidden" id="image2_b64" />
          </div>
        </div>

        <div class="toggle-box">
          <label
            ><input type="checkbox" id="auto-crop-check" />
            オートクロップ（自動補正）を有効にする</label
          >
        </div>
        <button type="submit" class="submit-btn">比較実行</button>
      </form>

      <div id="result-container" class="result-container" style="display: none">
        <div id="loading" style="display: none"><p>解析中...</p></div>
        <div id="result"></div>
        <div style="text-align: center; margin-top: 1rem">
          <a href="/">紹介ページに戻る</a>
        </div>
      </div>
    </main>

    <div id="cropping-modal" class="modal">
      <div class="modal-content">
        <img id="cropping-image" src="" />
        <button type="button" id="crop-btn">確定</button>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.js"></script>
    <script>
      // 既存のCropper.jsロジック（アスペクト比固定など）はそのまま維持
      // フォーム送信時に use_auto_crop フラグを JSON に含める
      document.getElementById("compareForm").onsubmit = async (e) => {
        e.preventDefault();
        const body = {
          image1_b64: document.getElementById("image1_b64").value,
          image2_b64: document.getElementById("image2_b64").value,
          use_auto_crop: document.getElementById("auto-crop-check").checked,
        };
        // fetch('/compare', ...) の処理
      };
      // その他のトリミング関数 showCroppingModal 等も維持
    </script>
  </body>
</html>
